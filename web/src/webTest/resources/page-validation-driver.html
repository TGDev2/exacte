<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Page pilote de la validation des lignes</title>
</head>
<body>
<iframe id="page" title="Page sous test" style="width: 1024px; height: 800px; border: 0"></iframe>
<pre id="result"></pre>
<script>
'use strict';
// Plays what page-driver.html does not: leaving a line without Enter, a line the core refuses, a blank line, and the
// exact value that only follows a cut text. Writes each state in <pre id="result">, as pure ASCII JSON.
const TOO_LONG = '1'.repeat(16385);
const observed = {error: null, states: {}};

function pause() {
  return new Promise((resolve) => setTimeout(resolve, 20));
}

function write() {
  document.getElementById('result').textContent = JSON.stringify(observed).replace(/[^\x20-\x7e]|[<>&]/g,
      (unit) => '\\u' + unit.charCodeAt(0).toString(16).padStart(4, '0'));
}

async function run() {
  const frame = document.getElementById('page');
  await new Promise((resolve) => {
    frame.addEventListener('load', resolve, {once: true});
    frame.src = 'index.html';
  });
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const lastField = () => {
    const rows = doc.querySelectorAll('[data-line]');
    return rows[rows.length - 1].querySelector('input.expression');
  };
  const pressEnter = (input) => input.dispatchEvent(new win.KeyboardEvent('keydown',
      {key: 'Enter', code: 'Enter', bubbles: true, cancelable: true}));
  const textOf = (row, selector) => {
    const part = row.querySelector(selector);
    return part === null ? '' : part.textContent;
  };
  const read = (name) => {
    const message = doc.getElementById('message');
    observed.states[name] = {
      lines: Array.from(doc.querySelectorAll('[data-line]'), (row) => ({
        length: row.querySelector('input.expression').value.length,
        value: row.querySelector('input.expression').value.substring(0, 40),
        result: textOf(row, '.result'),
        detail: textOf(row, '.detail'),
      })),
      messageShown: !message.hidden,
      message: message.textContent,
      focusedIsLast: doc.activeElement === lastField(),
    };
  };

  win.focus();
  read('atLoad');

  let field = lastField();
  field.focus();
  field.value = '1 + 1';
  doc.getElementById('display-mode').focus();
  await pause();
  read('afterLeaving');

  field = lastField();
  field.focus();
  field.value = TOO_LONG;
  pressEnter(field);
  await pause();
  read('afterRefusal');

  field = lastField();
  field.value = '3';
  pressEnter(field);
  await pause();
  read('afterCorrection');

  pressEnter(lastField());
  await pause();
  read('afterEnterOnABlankLine');

  field = lastField();
  field.value = '12,5';
  pressEnter(field);
  await pause();
  field = lastField();
  field.value = '1/3';
  pressEnter(field);
  await pause();
  read('auto');

  const select = doc.getElementById('display-mode');
  select.value = 'FRACTION';
  select.dispatchEvent(new win.Event('change', {bubbles: true}));
  await pause();
  read('fraction');
}

run().catch((failure) => {
  observed.error = String(failure);
}).finally(write);
</script>
</body>
</html>
