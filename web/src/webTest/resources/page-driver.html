<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Page pilote de la page Calc</title>
</head>
<body>
<iframe id="page" title="Page sous test" style="height: 800px; border: 0"></iframe>
<pre id="result"></pre>
<script>
'use strict';
// Plays a scenario in an iframe of index.html and writes what it observed, as JSON, in <pre id="result">.
//
//   ?scenario={"width":1024,"steps":[...]}
//
// Steps: {"enter":"text"} types in the last line; {"edit":"text","typed":0} types again in the line of the first
// {"enter"}; {"mode":"Fraction"} picks the option with this label; {"snapshot":"name"} keeps the state of the lines.
//
// Only the fixed selectors are used: [data-line="<number>"] with input.expression, .result, .badge, .detail, .error and
// mark; #display-mode; footer. The last line is taken whatever it holds, so the scenario does not depend on what the page
// shows at load: the observations of a step are read from the line that step typed in.

const WATCHDOG_MS = 19000;
const STEP_MS = 20;
const SETTLE_MS = 200;

const observed = {
  error: null, typed: [], snapshots: {}, source: null, modes: null, footer: null, layout: null, lang: null,
  alerts: 0, pageErrors: [], addedElements: [], resources: [], imgCount: null,
};
let finished = false;

function finish() {
  if (finished) {
    return;
  }
  finished = true;
  // Pure ASCII, without any character HTML would escape: the test reads the text of the dump as it is.
  document.getElementById('result').textContent = JSON.stringify(observed).replace(/[^\x20-\x7e]|[<>&]/g,
      (unit) => '\\u' + unit.charCodeAt(0).toString(16).padStart(4, '0'));
}

function pause(milliseconds) {
  return new Promise((resolve) => setTimeout(resolve, milliseconds));
}

function textOf(element) {
  return element === null ? '' : element.textContent.replace(/\s+/g, ' ').trim();
}

function isShown(element) {
  if (element === null || !element.checkVisibility({checkOpacity: true, checkVisibilityCSS: true})) {
    return false;
  }
  const box = element.getBoundingClientRect();
  return box.width > 0 && box.height > 0 && element.innerText.trim() !== '';
}

function staysInside(element, frame) {
  if (element === null) {
    return true;
  }
  const box = element.getBoundingClientRect();
  return box.left >= 0 && box.right <= frame.contentDocument.documentElement.clientWidth + 0.5;
}

function markOf(mark) {
  const whole = mark.parentElement.textContent;
  const before = document.createRange();
  before.selectNodeContents(mark.parentElement);
  before.setEndBefore(mark);
  const start = before.toString().length;
  return {
    text: mark.textContent,
    before: whole.substring(0, start),
    after: whole.substring(start + mark.textContent.length),
    shown: isShown(mark),
  };
}

function rowOf(row, frame) {
  const part = (selector) => row.querySelector(selector);
  const input = part('input.expression');
  return {
    line: Number(row.getAttribute('data-line')),
    value: input === null ? null : input.value,
    result: textOf(part('.result')),
    badge: textOf(part('.badge')),
    detail: textOf(part('.detail')),
    error: textOf(part('.error')),
    marks: Array.from(row.querySelectorAll('mark'), markOf),
    shown: {
      result: isShown(part('.result')), badge: isShown(part('.badge')),
      detail: isShown(part('.detail')), error: isShown(part('.error')),
    },
    inside: {
      result: staysInside(part('.result'), frame), badge: staysInside(part('.badge'), frame),
      detail: staysInside(part('.detail'), frame), error: staysInside(part('.error'), frame),
    },
  };
}

function rows(frame) {
  return Array.from(frame.contentDocument.querySelectorAll('[data-line]'), (row) => rowOf(row, frame));
}

// What a browser does: keydown goes to the field, then the rest goes to whatever holds the focus by then.
function pressEnter(frame, input) {
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const press = (type, target) => target.dispatchEvent(new win.KeyboardEvent(type, {
    key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true, cancelable: true,
  }));
  const focused = () => (doc.activeElement && doc.activeElement.isConnected ? doc.activeElement : doc.body);
  if (press('keydown', input)) {
    press('keypress', focused());
  }
  press('keyup', focused());
}

async function typeIn(frame, number, text) {
  const row = frame.contentDocument.querySelector('[data-line="' + number + '"]');
  const input = row === null ? null : row.querySelector('input.expression');
  if (input === null) {
    throw new Error('la ligne ' + number + ' n\'a pas de input.expression');
  }
  input.focus();
  input.value = text;
  input.dispatchEvent(new frame.contentWindow.Event('input', {bubbles: true}));
  pressEnter(frame, input);
  await pause(STEP_MS);
}

async function enterInLastLine(frame, text) {
  const lines = frame.contentDocument.querySelectorAll('[data-line]');
  if (lines.length === 0) {
    throw new Error('la page ne montre aucune ligne [data-line]');
  }
  const number = Number(lines[lines.length - 1].getAttribute('data-line'));
  observed.typed.push({text: text, line: number});
  await typeIn(frame, number, text);
}

async function chooseMode(frame, label) {
  const select = frame.contentDocument.getElementById('display-mode');
  if (select === null) {
    throw new Error('la page n\'a pas de #display-mode');
  }
  const option = Array.from(select.options).find((candidate) => textOf(candidate) === label);
  if (option === undefined) {
    throw new Error('#display-mode ne propose pas ' + label);
  }
  select.value = option.value;
  select.dispatchEvent(new frame.contentWindow.Event('input', {bubbles: true}));
  select.dispatchEvent(new frame.contentWindow.Event('change', {bubbles: true}));
  await pause(STEP_MS);
}

async function play(frame, step) {
  if ('enter' in step) {
    await enterInLastLine(frame, step.enter);
  } else if ('edit' in step) {
    await typeIn(frame, observed.typed[step.typed].line, step.edit);
  } else if ('mode' in step) {
    await chooseMode(frame, step.mode);
  } else if ('snapshot' in step) {
    observed.snapshots[step.snapshot] = rows(frame);
  } else {
    throw new Error('étape inconnue : ' + JSON.stringify(step));
  }
}

// index.html as it is served, before any script of the page changes it.
async function readSource() {
  const answer = await fetch('index.html', {cache: 'no-store'});
  if (!answer.ok) {
    throw new Error('index.html : HTTP ' + answer.status);
  }
  const page = new DOMParser().parseFromString(await answer.text(), 'text/html');
  const all = (selector, read) => Array.from(page.querySelectorAll(selector), read);
  const viewport = page.querySelector('meta[name="viewport"]');
  return {
    lang: page.documentElement.getAttribute('lang'),
    viewport: viewport === null ? null : viewport.getAttribute('content'),
    scripts: all('script', (element) => ({src: element.getAttribute('src'), type: element.getAttribute('type')})),
    links: all('link', (element) => ({rel: element.getAttribute('rel'), href: element.getAttribute('href')})),
    images: all('img', (element) => element.getAttribute('src')),
    styles: page.querySelectorAll('style').length,
  };
}

function watchThePage(frame) {
  const win = frame.contentWindow;
  const countAlert = () => {
    observed.alerts += 1;
  };
  win.alert = countAlert;
  win.confirm = countAlert;
  win.prompt = countAlert;
  win.addEventListener('error', (event) => observed.pageErrors.push(String(event.message)));
  win.addEventListener('unhandledrejection', (event) => observed.pageErrors.push(String(event.reason)));
  new win.MutationObserver((records) => {
    for (const record of records) {
      for (const node of record.addedNodes) {
        if (node.nodeType === 1) {
          const dangerous = [node].concat(Array.from(node.querySelectorAll('*'))).filter((element) =>
            ['IMG', 'SCRIPT', 'IFRAME', 'OBJECT', 'EMBED', 'SVG'].includes(element.tagName.toUpperCase()));
          observed.addedElements.push(...dangerous.map((element) => element.tagName));
        }
      }
    }
  }).observe(frame.contentDocument.documentElement, {childList: true, subtree: true});
}

function readFinalState(frame) {
  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  const select = doc.getElementById('display-mode');
  const footer = doc.querySelector('footer');
  observed.lang = doc.documentElement.getAttribute('lang');
  observed.imgCount = doc.querySelectorAll('img').length;
  observed.modes = select === null ? null : {
    tag: select.tagName,
    label: select.labels !== null && select.labels.length > 0
      ? textOf(select.labels[0]) : (select.getAttribute('aria-label') || ''),
    selected: select.selectedIndex < 0 ? null : textOf(select.options[select.selectedIndex]),
    options: Array.from(select.options, textOf),
  };
  observed.footer = footer === null ? null : {
    text: textOf(footer),
    links: Array.from(footer.querySelectorAll('a'), (link) => ({text: textOf(link), href: link.getAttribute('href')})),
  };
  observed.layout = {
    innerWidth: win.innerWidth,
    scrollWidth: doc.documentElement.scrollWidth,
    clientWidth: doc.documentElement.clientWidth,
  };
  observed.resources = win.performance.getEntriesByType('resource').map((entry) => entry.name)
      .map((name) => (name.startsWith(location.origin + '/') ? name.substring(location.origin.length) : name));
  observed.snapshots.final = rows(frame);
}

async function run() {
  const scenario = JSON.parse(new URLSearchParams(location.search).get('scenario'));
  const frame = document.getElementById('page');
  frame.style.width = (scenario.width || 1024) + 'px';
  observed.source = await readSource();
  await new Promise((resolve) => {
    frame.addEventListener('load', resolve, {once: true});
    frame.src = 'index.html';
  });
  watchThePage(frame);
  for (const step of scenario.steps) {
    await play(frame, step);
  }
  // Lets a failed image of a hostile line report its error before the last reading.
  await pause(SETTLE_MS);
  readFinalState(frame);
}

setTimeout(() => {
  observed.error = observed.error || 'pas de constat au bout de ' + WATCHDOG_MS + ' ms';
  finish();
}, WATCHDOG_MS);

run().catch((failure) => {
  observed.error = String(failure);
}).finally(finish);
</script>
</body>
</html>
