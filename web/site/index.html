<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Un carnet de calcul exact dans le navigateur : chaque résultat est exact, ou donné avec son erreur maximale.">
<title>Calc : le carnet de calcul exact</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="feuille">
<header class="entete">
<div>
<h1>Calc</h1>
<p class="these">Chaque résultat est exact, ou donné avec son erreur maximale.</p>
</div>
<p class="reglage">
<label for="display-mode">Affichage</label>
<select id="display-mode">
<option value="AUTO">Auto</option>
<option value="DECIMAL">Décimal</option>
<option value="FRACTION">Fraction</option>
<option value="SCIENTIFIC">Scientifique</option>
</select>
<button type="button" id="open-palette" class="commandes" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K">Commandes</button>
</p>
</header>
<main>
<div class="outils" role="toolbar" aria-label="Actions sur le carnet">
<button type="button" data-action="undo" data-shortcut="Ctrl+Z">Annuler</button>
<button type="button" data-action="redo" data-shortcut="Ctrl+Y">Rétablir</button>
<button type="button" data-action="insert" data-shortcut="Ctrl+Entrée">Insérer</button>
<button type="button" data-action="up" data-shortcut="Ctrl+Maj+↑">Monter</button>
<button type="button" data-action="down" data-shortcut="Ctrl+Maj+↓">Descendre</button>
<button type="button" data-action="delete" data-shortcut="Ctrl+Maj+K">Supprimer</button>
<button type="button" data-action="clear">Effacer le carnet</button>
<button type="button" data-action="example">Carnet d'exemple</button>
</div>
<p id="message" role="status" hidden></p>
<ol id="lines"></ol>
<noscript><p class="sans-script">Cette page calcule dans le navigateur : activez JavaScript pour écrire un carnet.</p></noscript>
</main>
<footer class="pied">
<p>Le carnet reste dans ce navigateur, sans fichier ni envoi.</p>
<p class="liens">
<a href="https://github.com/TGDev2/exacte">Code source</a>
<a href="rapport-conformite.html">Rapport de conformité</a>
</p>
</footer>
</div>
<div id="command-palette" role="dialog" aria-label="Palette de commandes" hidden>
<input id="command-search" type="text" role="combobox" aria-label="Rechercher une commande" aria-expanded="true" aria-controls="command-list" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Rechercher une commande">
<ul id="command-list" role="listbox" aria-label="Commandes"></ul>
<p id="command-empty" hidden></p>
</div>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
