name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the checksum of every Gradle wrapper jar (validate-wrappers defaults to true).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # Linux runners have no display: xvfb (preinstalled on ubuntu-latest) provides one.
      # requireUiTests makes the ui tests fail, instead of being skipped, when no display is available.
      - name: Check (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew check -PrequireUiTests=true --console=plain

      - name: Check (Windows, macOS)
        if: runner.os != 'Linux'
        run: ./gradlew check -PrequireUiTests=true --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests
            build/test-results
          if-no-files-found: warn
          retention-days: 7

  # The jar that goes into a release must not depend on the build time or the file order (ADR 0012).
  # One system is enough: the content of the jar does not depend on it.
  reproducible-jar:
    name: reproducible jar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # --rerun-tasks recompiles everything and --no-build-cache forbids a cache hit, so both jars are really built.
      - name: Build the jar twice and compare
        run: |
          ./gradlew clean jar --rerun-tasks --no-build-cache --console=plain
          first=$(sha256sum build/libs/calc.jar | cut -d' ' -f1)
          ./gradlew clean jar --rerun-tasks --no-build-cache --console=plain
          second=$(sha256sum build/libs/calc.jar | cut -d' ' -f1)
          echo "first build:  $first"
          echo "second build: $second"
          test "$first" = "$second"

  # Mutation tests take several minutes (about 6 on a development machine, see docs/TESTS.md): they run on main and on demand,
  # not on every pull request, which only runs check (coverage thresholds included).
  conformity:
    name: conformity report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # check (tests, coverage thresholds), then PIT, then the report; it fails if a threshold or a source is missing.
      - name: Check, mutation tests and conformity report
        run: xvfb-run -a ./gradlew conformity -PrequireUiTests=true -Pjqwik.reporting.onlyfailures=false --console=plain

      - name: Upload the conformity report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformity-report
          path: |
            build/reports/conformite
            build/reports/pitest
            build/reports/jacoco
          if-no-files-found: warn
          retention-days: 30
