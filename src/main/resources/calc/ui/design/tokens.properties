# Design tokens of the calculator: the single source of the colours, fonts and sizes of the desktop and of the web page
# (ADR 0016). Read at run time by calc.ui.design.DesignTokens. After a change, run
#   gradlew generateDesignTokens
# which rewrites src/main/resources/calc/ui/theme/CalcLightLaf.properties, CalcDarkLaf.properties and web/site/tokens.css;
# DesignTokensAcceptanceTest fails while they differ from this file.
#
# Direction: a sheet that calculates, after the French ruled school notebook. Light: a paper barely tinted blue, blue-black
# ink, the blue of the ruling for focus and accent, the red of the margin line for errors. Dark: a blue-night slate with the
# same hues lightened. An exact result is quiet (a soft green), an approximate one shows through an ochre hue.
#
# Formats:
#   color.<light|dark>.<role>=#RRGGBB      the same roles in both themes
#   font.<ui|mono>.family=<family>
#   font.size.<name>, space.<n>, radius.<name>=<pixels>   spaces on a 4 px grid
#   contrast.text.<name>=<text role> on <background role>   at least 4.5:1 in both themes
#   contrast.ui.<name>=<role> on <background role>          at least 3:1 in both themes (indicators that are not text)

# ---------------------------------------------------------------------------------------------------------------- light
# Surfaces: the sheet, a raised panel, the row under the pointer, the active row.
color.light.surface.base=#FBFCFE
color.light.surface.raised=#F2F5FA
color.light.surface.hover=#EAF0F8
color.light.surface.active=#E1EAF6
# Borders: the ruling between fields, the focus ring.
color.light.border.subtle=#C9D4E5
color.light.border.focus=#2F5DA8
# Ink: results and typed text, line numbers and status, hints and placeholders (still text: 4.5:1).
color.light.text.primary=#1A2233
color.light.text.secondary=#3F4A5E
color.light.text.muted=#566074
# Signs and marks: the accent, the exactness of a result, the definition of a variable.
color.light.accent=#2F5DA8
color.light.exact.sign=#2B6A4C
color.light.exact.surface=#E3F1E9
color.light.approximate.sign=#8A4500
color.light.approximate.surface=#FCEBD2
color.light.source.mark=#5B3A9A
color.light.source.surface=#ECE6F7
# Errors: the message, its background, the line under the faulty part.
color.light.error.text=#B0263B
color.light.error.surface=#FCEEF0
color.light.error.underline=#C8364B
# Selected text.
color.light.selection.background=#2F5DA8
color.light.selection.text=#FFFFFF

# ----------------------------------------------------------------------------------------------------------------- dark
color.dark.surface.base=#161B24
color.dark.surface.raised=#1D2430
color.dark.surface.hover=#252E3C
color.dark.surface.active=#2B3747
color.dark.border.subtle=#3A4556
color.dark.border.focus=#8DB2EE
color.dark.text.primary=#E6EAF2
color.dark.text.secondary=#BAC3D3
color.dark.text.muted=#9CA6B8
color.dark.accent=#8DB2EE
color.dark.exact.sign=#8CCBA9
color.dark.exact.surface=#1C3128
color.dark.approximate.sign=#EBB566
color.dark.approximate.surface=#3A2C14
color.dark.source.mark=#C3AEF0
color.dark.source.surface=#2C2540
color.dark.error.text=#F59AA5
color.dark.error.surface=#3B1E26
color.dark.error.underline=#F07A8A
color.dark.selection.background=#8DB2EE
color.dark.selection.text=#161B24

# ---------------------------------------------------------------------------------------------------------------- fonts
# Inter for the interface, JetBrains Mono for what the user types.
font.ui.family=Inter
font.mono.family=JetBrains Mono
font.size.caption=12
font.size.body=14
font.size.result=16
font.size.title=20

# ---------------------------------------------------------------------------------------------------- spaces and radii
space.1=4
space.2=8
space.3=12
space.4=16
space.6=24
space.8=32
radius.small=4
radius.medium=6
radius.large=10

# ------------------------------------------------------------------------------------------------------------- contrast
# Texts, at least 4.5:1.
contrast.text.primary=text.primary on surface.base
contrast.text.primary-active=text.primary on surface.active
contrast.text.primary-error=text.primary on error.surface
contrast.text.secondary=text.secondary on surface.base
contrast.text.secondary-active=text.secondary on surface.active
contrast.text.muted=text.muted on surface.base
contrast.text.muted-raised=text.muted on surface.raised
contrast.text.muted-active=text.muted on surface.active
contrast.text.accent=accent on surface.base
contrast.text.exact=exact.sign on surface.base
contrast.text.exact-badge=exact.sign on exact.surface
contrast.text.exact-active=exact.sign on surface.active
contrast.text.approximate=approximate.sign on surface.base
contrast.text.approximate-badge=approximate.sign on approximate.surface
contrast.text.approximate-active=approximate.sign on surface.active
contrast.text.source=source.mark on surface.base
contrast.text.source-cell=source.mark on source.surface
contrast.text.error=error.text on surface.base
contrast.text.error-active=error.text on surface.active
contrast.text.error-surface=error.text on error.surface
contrast.text.selection=selection.text on selection.background
# Indicators that are not text, at least 3:1.
contrast.ui.focus=border.focus on surface.base
contrast.ui.focus-active=border.focus on surface.active
contrast.ui.accent=accent on surface.base
contrast.ui.error-underline=error.underline on surface.base
contrast.ui.error-underline-active=error.underline on surface.active
contrast.ui.error-underline-surface=error.underline on error.surface
