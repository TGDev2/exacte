# jqwik configuration. jqwik reads JUnit Platform configuration parameters; the old jqwik.properties file is
# ignored since jqwik 1.6.0. Reference: https://jqwik.net/docs/current/user-guide.html#jqwik-configuration

# Number of generated cases per property. Properties that touch the file system fix a smaller number themselves.
jqwik.tries.default = 1000

# Every property is reported (tries, checks, generation, seed). A failure always prints the seed and the shrunk
# sample; rerunning the build replays the failing seed first (see docs/TESTS.md).
jqwik.reporting.onlyfailures = false
jqwik.failures.after.default = SAMPLE_FIRST
jqwik.shrinking.default = BOUNDED
jqwik.shrinking.bounded.seconds = 10

# A fixed seed in the sources is allowed locally to reproduce a failure, but is reported as a warning.
jqwik.seeds.whenfixed = WARN
